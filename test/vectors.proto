// Test-vector schema exercising every protobuf wire type.
// Golden bytes are generated by tools/gen_proto_vectors.py using the
// reference Python protobuf implementation.
syntax = "proto3";

package grpcmojo.test;

enum Status {
  option allow_alias = true;
  STATUS_UNSPECIFIED = 0;
  STATUS_ACTIVE = 1;
  STATUS_ENABLED = 1;
  STATUS_PAUSED = 2;
  STATUS_NEGATIVE = -1;
}

message Scalars {
  int32 f_int32 = 1;
  int64 f_int64 = 2;
  uint32 f_uint32 = 3;
  uint64 f_uint64 = 4;
  sint32 f_sint32 = 5;
  sint64 f_sint64 = 6;
  bool f_bool = 7;
  fixed32 f_fixed32 = 8;
  fixed64 f_fixed64 = 9;
  sfixed32 f_sfixed32 = 10;
  sfixed64 f_sfixed64 = 11;
  float f_float = 12;
  double f_double = 13;
  string f_string = 14;
  bytes f_bytes = 15;
  // field number above the 1-byte-tag boundary
  int32 f_big_field = 1000;
}

message Nested {
  Scalars inner = 1;
  repeated int32 packed_ints = 2;
  repeated string names = 3;
  repeated Scalars inners = 4;
  map<string, int32> counts = 5;
  oneof choice {
    string as_text = 6;
    int64 as_num = 7;
  }
}

// Recursive type for decode-depth-limit testing.
message Tree {
  Tree child = 1;
  int32 v = 2;
}

message EchoRequest {
  string message = 1;
}

message EchoResponse {
  string message = 1;
}

message EnumValue {
  Status status = 1;
}

message JsonChild {
  int32 id = 1;
  string note = 2;
}

message JsonParent {
  JsonChild child = 1;
  EchoRequest echo = 2;
}
