# protomojo — Protocol Buffers wire format + runtime for Mojo 1.0, plus the
# protoc-gen-mojo code generator (tools/). The conda package is defined in
# recipe/recipe.yaml.

[workspace]
channels = ["https://conda.modular.com/max", "conda-forge"]
name = "protomojo"
platforms = ["osx-arm64", "linux-64", "linux-aarch64"]
version = "0.4.1"
license = "Apache-2.0"
preview = ["pixi-build"]

[tasks]
test = "python3 tools/run_tests.py"
compliance = "python3 compliance/run_compliance.py"
bench = "mojo run -I src -I test bench/bench_proto.mojo"
bench-smoke = "mojo run -I src -I test bench/bench_proto.mojo --smoke"
fuzz-wire-smoke = "python3 fuzz/run_wire_fuzz.py --seed 20260824 --cases 250"
fuzz-wire-weekly = "python3 fuzz/run_wire_fuzz.py --seed 20260824 --cases 20000"
fuzz-json-smoke = "python3 fuzz/run_json_fuzz.py --seed 20260827 --cases 250"
fuzz-json-weekly = "python3 fuzz/run_json_fuzz.py --seed 20260827 --cases 20000"
gen-vectors = "python3 tools/gen_proto_vectors.py"
gen-proto = "python3 -m grpc_tools.protoc -Itest --plugin=protoc-gen-mojo=tools/protoc-gen-mojo --mojo_out=test test/vectors.proto"
example = "python3 examples/run_codegen_roundtrip.py"
package-test = "python3 packaging/test_installed_package.py"

[dependencies]
mojo = ">=1.0.0,<2"
python = ">=3.11"

[pypi-dependencies]
grpcio-tools = ">=1.60"
protobuf = ">=4.25"

[package]
name = "protomojo"
version = "0.4.1"

[package.build]
backend = { name = "pixi-build-rattler-build", version = "0.*" }
