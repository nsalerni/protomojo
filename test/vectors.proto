// Test-vector schema exercising every protobuf wire type.
// Golden bytes are generated by tools/gen_proto_vectors.py using the
// reference Python protobuf implementation.
syntax = "proto3";

package grpcmojo.test;

enum Status {
  option allow_alias = true;
  STATUS_UNSPECIFIED = 0;
  STATUS_ACTIVE = 1;
  STATUS_ENABLED = 1;
  STATUS_PAUSED = 2;
  STATUS_NEGATIVE = -1;
}

message Scalars {
  int32 f_int32 = 1;
  int64 f_int64 = 2;
  uint32 f_uint32 = 3;
  uint64 f_uint64 = 4;
  sint32 f_sint32 = 5;
  sint64 f_sint64 = 6;
  bool f_bool = 7;
  fixed32 f_fixed32 = 8;
  fixed64 f_fixed64 = 9;
  sfixed32 f_sfixed32 = 10;
  sfixed64 f_sfixed64 = 11;
  float f_float = 12;
  double f_double = 13;
  string f_string = 14;
  bytes f_bytes = 15;
  // field number above the 1-byte-tag boundary
  int32 f_big_field = 1000;
}

message Nested {
  Scalars inner = 1;
  repeated int32 packed_ints = 2;
  repeated string names = 3;
  repeated Scalars inners = 4;
  map<string, int32> counts = 5;
  oneof choice {
    string as_text = 6;
    int64 as_num = 7;
  }
}

// Recursive type for decode-depth-limit testing.
message Tree {
  Tree child = 1;
  int32 v = 2;
}

message EchoRequest {
  string message = 1;
}

message EchoResponse {
  string message = 1;
}

message EnumValue {
  Status status = 1;
}

message JsonChild {
  int32 id = 1;
  string note = 2;
}

message JsonParent {
  JsonChild child = 1;
  EchoRequest echo = 2;
}

message JsonRepeated {
  repeated int32 int32_values = 1;
  repeated int64 int64_values = 2;
  repeated uint32 uint32_values = 3;
  repeated uint64 uint64_values = 4;
  repeated sint32 sint32_values = 5;
  repeated sint64 sint64_values = 6;
  repeated bool bool_values = 7;
  repeated fixed32 fixed32_values = 8;
  repeated fixed64 fixed64_values = 9;
  repeated sfixed32 sfixed32_values = 10;
  repeated sfixed64 sfixed64_values = 11;
  repeated float float_values = 12;
  repeated double double_values = 13;
  repeated string string_values = 14;
  repeated bytes bytes_values = 15;
  repeated Status status_values = 16;
}

message JsonRepeatedMessages {
  repeated JsonChild children = 1;
  repeated EchoRequest echoes = 2;
}

message JsonStringMaps {
  map<string, int32> int32_values = 1;
  map<string, int64> int64_values = 2;
  map<string, uint32> uint32_values = 3;
  map<string, uint64> uint64_values = 4;
  map<string, sint32> sint32_values = 5;
  map<string, sint64> sint64_values = 6;
  map<string, bool> bool_values = 7;
  map<string, fixed32> fixed32_values = 8;
  map<string, fixed64> fixed64_values = 9;
  map<string, sfixed32> sfixed32_values = 10;
  map<string, sfixed64> sfixed64_values = 11;
  map<string, float> float_values = 12;
  map<string, double> double_values = 13;
  map<string, string> string_values = 14;
  map<string, bytes> bytes_values = 15;
  map<string, Status> status_values = 16;
}

message JsonKeyMaps {
  map<int32, string> int32_values = 1;
  map<int64, string> int64_values = 2;
  map<uint32, string> uint32_values = 3;
  map<uint64, string> uint64_values = 4;
  map<sint32, string> sint32_values = 5;
  map<sint64, string> sint64_values = 6;
  map<bool, string> bool_values = 7;
  map<fixed32, string> fixed32_values = 8;
  map<fixed64, string> fixed64_values = 9;
  map<sfixed32, string> sfixed32_values = 10;
  map<sfixed64, string> sfixed64_values = 11;
  map<int32, Status> int32_status_values = 12;
}
