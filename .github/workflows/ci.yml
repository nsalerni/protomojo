name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [macos-14, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: prefix-dev/setup-pixi@v0.8.11
        with:
          pixi-version: latest
          cache: true

      - name: Cache protobuf conformance runner
        id: conformance-cache
        uses: actions/cache@v4
        with:
          path: ~/conformance
          key: conformance-runner-v33.4-${{ runner.os }}-${{ runner.arch }}-v1

      - name: Install protobuf build dependencies
        if: steps.conformance-cache.outputs.cache-hit != 'true'
        run: |
          if [ "$RUNNER_OS" = "Linux" ]; then
            sudo apt-get update
            sudo apt-get install -y ninja-build python3-venv
          else
            brew install ninja
          fi
          python3 -m venv "$RUNNER_TEMP/cmake-4.1.2"
          "$RUNNER_TEMP/cmake-4.1.2/bin/python" -m pip install --disable-pip-version-check cmake==4.1.2
          echo "$RUNNER_TEMP/cmake-4.1.2/bin" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/cmake-4.1.2/bin/cmake" --version
          ninja --version

      - name: Build protobuf conformance runner
        if: steps.conformance-cache.outputs.cache-hit != 'true'
        run: |
          git clone --depth 1 --branch v33.4 https://github.com/protocolbuffers/protobuf ~/protobuf-src
          cd ~/protobuf-src && git submodule update --init --recursive --depth 1
          cmake -G Ninja -B build \
            -Dprotobuf_BUILD_CONFORMANCE=ON \
            -Dprotobuf_BUILD_TESTS=OFF \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_CXX_STANDARD=17
          ninja -C build conformance_test_runner
          mkdir -p ~/conformance && cp build/conformance_test_runner ~/conformance/
          find build \( -name "*.dylib" -o -name "*.so" -o -name "*.so.*" \) \
            -exec cp -a {} ~/conformance/ \;

      - name: Docstring coverage (mojo doc gate)
        run: |
          total=0
          for f in src/proto/*.mojo; do
            n=$(pixi run mojo doc --diagnose-missing-doc-strings -o /dev/null "$f" 2>&1 | grep -c warning || true)
            if [ "$n" != "0" ]; then echo "MISSING DOCS: $f ($n)"; total=$((total+n)); fi
          done
          test "$total" = "0"

      - name: Unit tests
        run: pixi run test

      - name: Benchmarks (smoke)
        run: pixi run bench-smoke

      - name: Compatibility suite (differential vs Python protobuf + Google conformance)
        run: |
          chmod +x "$HOME/conformance/conformance_test_runner"
          export LD_LIBRARY_PATH="$HOME/conformance:${LD_LIBRARY_PATH:-}"
          export DYLD_LIBRARY_PATH="$HOME/conformance:${DYLD_LIBRARY_PATH:-}"
          CONFORMANCE_RUNNER="$HOME/conformance/conformance_test_runner" pixi run compliance

      - name: Upload compatibility report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: compliance-report-${{ matrix.os }}
          path: |
            COMPLIANCE.md
            COMPLIANCE.html

  package:
    name: package (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [macos-14, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: prefix-dev/setup-pixi@v0.8.11
        with:
          pixi-version: latest
          cache: true

      - name: Build and test the installed package
        run: python3 packaging/test_installed_package.py
