context:
  version: "0.4.4"

package:
  name: protomojo
  version: ${{ version }}

source:
  path: ..

build:
  number: 0
  script:
    interpreter: bash
    content:
      - |
        set -euo pipefail
        mkdir -p "${PREFIX}/bin" "${PREFIX}/lib/mojo"
        mojo precompile src/proto -o "${PREFIX}/lib/mojo/proto.mojoc"
        install -m 0755 tools/protoc-gen-mojo "${PREFIX}/bin/protoc-gen-mojo"

requirements:
  # A precompiled .mojoc only loads under the exact compiler that built it.
  # So build with whichever compiler the consumer selects (a bare name, so a
  # pixi `build-variants` / rattler-build variant entry for `mojo-compiler`
  # applies; otherwise the newest one is used), and pin the run requirement
  # to exactly that compiler.
  build:
    - mojo-compiler
  host:
    - mojo-compiler
  run:
    - libprotobuf
    - ${{ pin_compatible('mojo-compiler', exact=True) }}
    - python >=3.11
    - protobuf >=4.25

tests:
  - script:
      interpreter: bash
      content:
        - |
          set -euo pipefail
          command -v protoc-gen-mojo
          command -v protoc
          protoc --mojo_out=tests tests/package_smoke.proto
          mojo build -I tests tests/package_smoke.mojo -o package_smoke
          ./package_smoke
    files:
      recipe:
        - tests/package_smoke.mojo
        - tests/package_smoke.proto

about:
  homepage: https://github.com/nsalerni/protomojo
  license: Apache-2.0
  license_file: LICENSE
  summary: Protocol Buffers runtime and protoc plugin for Mojo
  repository: https://github.com/nsalerni/protomojo

extra:
  maintainers:
    - nsalerni
  project_name: protomojo
